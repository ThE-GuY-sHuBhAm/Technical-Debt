# TDEA continuous integration (execution plan, Day 1, Task 2).
#
# tests            NFR-21, NFR-22: product suite on Linux, macOS and Windows x Python
#                  3.10-3.12. The RE suite (tests/research) needs Python 3.11 (NFR-24),
#                  so it runs in the 3.11 cells only. Coverage is reported per package
#                  (NFR-13). From Day 6 the 70% gate applies in the 3.11 cells, which run
#                  the whole suite; the 3.10 and 3.12 cells skip tests/research, so their
#                  figures are reported only and the gate is not claimed for them.
# quality          NFR-12 per-file Pylint >= 8.0 with the default configuration, all
#                  files in one run as TC-134 does; NFR-15 pydocstyle.
# dashboard-guard  Section 6: research commits change nothing under dashboard/.
# live-github      FR-03/FR-04 against the real api.github.com (tests/product/
#                  test_github_live.py); elsewhere those tests are skipped, not passed.
#                  It also runs TC-142: a full real analysis under strace, whose every
#                  connection must go to GitHub's published addresses.
# tc145            TC-145 / NFR-23: every tests cell writes the MD5 of FX-M's CSV export
#                  (from the TC-128 test); this job checks that all of them are equal.
# browser          The workbook's browser cases (tests/browser) in headless Chrome with
#                  Selenium, against a TDEA server on 127.0.0.1 with FR-03 answered by a
#                  stubbed transport; elsewhere they are skipped, not passed.
#
# Runner images: ubuntu-22.04 is the version TC-143 names (GitHub retires it on
# 17 Apr 2027). GitHub no longer offers macOS 13 or an x64 Windows 11 image, so
# macos-15 and windows-2025 stand in; TC-143 itself still needs the manual runs.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tdea with the dev extra
        run: python -m pip install -e ".[dev]"
      - name: Check pins and record resolved versions (CL-02)
        run: |
          python -m pip check
          python -m pip list --format=freeze
      - name: Console script
        run: tdea research --help
      - name: Test suite with coverage
        env:
          TDEA_TC145_OUT: ${{ github.workspace }}/tc145.md5
        run: |
          if [ "${{ matrix.python }}" = "3.11" ]; then
            suite=()
          else
            suite=(--ignore=tests/research)
          fi
          python -m pytest "${suite[@]}" --cov=tdea --cov-report=term-missing \
            --cov-report=json:coverage.json
      - name: Coverage per package (NFR-13)
        run: |
          if [ "${{ matrix.python }}" = "3.11" ]; then
            python tools/coverage_by_package.py coverage.json --fail-under 70
          else
            python tools/coverage_by_package.py coverage.json
          fi
      - name: FX-M CSV MD5 for TC-145
        uses: actions/upload-artifact@v4
        with:
          name: tc145-${{ matrix.os }}-python-${{ matrix.python }}
          path: tc145.md5
          if-no-files-found: error

  tc145:
    name: same FX-M CSV MD5 on every OS (TC-145)
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tc145-*
      - name: Compare the MD5 of every cell
        run: |
          for folder in tc145-*; do
            printf '%s  %s\n' "$(tr -d '\r\n' < "$folder/tc145.md5")" "$folder"
          done
          test "$(cat tc145-*/tc145.md5 | tr -d '\r' | sort -u | wc -l)" -eq 1
          test "$(ls -d tc145-* | wc -l)" -eq 9

  quality:
    name: quality gates (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tdea with the dev extra
        run: python -m pip install -e ".[dev]"
      - name: Pylint, default configuration, every file >= 8.0 (NFR-12)
        run: python tools/check_pylint_scores.py --min-score 8.0
      - name: pydocstyle (NFR-15)
        run: python -m pydocstyle tdea tests tools harness

  dashboard-guard:
    name: research commits leave dashboard/ unchanged
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check every commit reachable from HEAD
        run: python tools/check_dashboard_paths.py

  live-github:
    name: live GitHub API (FR-03)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tdea with the dev extra
        run: python -m pip install -e ".[dev]"
      - name: strace for TC-142
        run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)
      - name: Real GET /repos/{owner}/{repo}, no token; TC-142 full analysis
        env:
          TDEA_LIVE_GITHUB: "1"
          TDEA_TC142: "1"
        run: python -m pytest tests/product/test_github_live.py -v -rs -s

  browser:
    name: browser (Selenium, headless Chrome)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tdea with the dev extra
        run: python -m pip install -e ".[dev]"
      - name: Chrome and ChromeDriver on the runner
        run: |
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
      - name: Workbook browser cases
        env:
          TDEA_BROWSER_TESTS: "1"
        run: python -m pytest tests/browser -v -rs --durations=20
